<style>

<script>
'use strict';
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),me=uid();
const P=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const T=i=>i?+new Date(i):NaN,tm=i=>i?P(new Date(i).getHours())+':'+P(new Date(i).getMinutes()):'—';
const fmt=i=>{if(!i)return'—';const d=new Date(i);return P(d.getDate())+'.'+P(d.getMonth()+1)+'.'+d.getFullYear()+' '+tm(i)};
const toL=i=>{if(!i)return'';const d=new Date(i);return ymd(d)+'T'+tm(i)},toI=l=>l?new Date(l).toISOString():'';
const LBL={en_cours:'En cours',a_traiter:'Terminée — à traiter',traitee:'Traitée'};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return''}};
const S={view:'dash',sel:null,pan:ls('gpan')!=='0',gs:'type',all:false,admin:null,open:new Set(),cday:ymd(new Date()),cmon:ymd(new Date()).slice(0,7),day:ymd(new Date()),grp:'mois',f:{},h:{},sort:{k:'debut',d:-1},user:ls('gu'),role:(ls('gr')==='Administrateur'?'':ls('gr'))||'Opérateur'};
let D=null,C=null,AG=null,dir=null,busy=false;const MO={};
const rw=()=>S.role!=='Consultation',adm=()=>S.role==='Administrateur',canEdit=g=>adm()||(rw()&&g.statut!=='traitee');
const G=(d,id)=>d.gardes.find(g=>g.id===id),AN=a=>a||'?',isPq=a=>a.piquet===true||a.mode==='piquet';
function choose(title,label,opts){return new Promise((res,rej)=>{const d=$('dlg2');
  d.innerHTML=`<form method="dialog"><h3>${esc(title)}</h3><label>${esc(label)}<select name="v">${opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label><p><button>Valider</button> <button type="button" class="s" data-a="close2">Annuler</button></p></form>`;
  let done=false;const fm=d.querySelector('form');fm.onsubmit=e=>{e.preventDefault();done=true;res(fm.elements.v.value);d.close()};
  d.addEventListener('close',()=>{if(!done)rej(new Error('Choix annulé.'))},{once:true});d.showModal()})}
const nz=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const PL=()=>AG?.pool||[],pcan=p=>p.nom.toUpperCase()+' '+p.prenom,dh=m=>{m=Math.round(m);return Math.floor(m/60)+'h'+P(m%60)};
/* Agent du pool : retrouvé par matricule, "nom prénom", "prénom nom" ou nom seul s'il est unique ; sinon agent hors pool, gardé tel que saisi */
function resolveAg(txt){const t=nz(txt),pl=PL();if(!t)return{agent:'',mat:''};
  let m=pl.filter(p=>nz(p.mat)===t);
  if(!m.length)m=pl.filter(p=>nz(p.nom+' '+p.prenom)===t||nz(p.prenom+' '+p.nom)===t);
  if(!m.length)m=pl.filter(p=>nz(p.nom)===t);
  if(m.length>1)return{agent:String(txt).trim(),mat:'',amb:m};
  return m.length?{agent:pcan(m[0]),mat:m[0].mat,p:m[0]}:{agent:String(txt).trim(),mat:''}}
/* LTR : règles modifiables dans l'administration */
const LTRD={jours:6,repos:10,sem:35,jour:13,pjour:14,nuit:11,pnuit:13},LTRC=()=>({...LTRD,...(C?.ltr||{})}),isNightSv=t=>/nuit/i.test(t||'');
function shiftsAll(){const m=new Map();D.gardes.forEach(g=>g.services.forEach(v=>{if(v.type==='Pause')return;v.aff.forEach(a=>{if(!a.mat)return;const r=a.debut_reel&&a.fin_reel,s=T(r?a.debut_reel:a.debut),e=T(r?a.fin_reel:a.fin);if(isNaN(s)||isNaN(e))return;
  if(!m.has(a.mat))m.set(a.mat,[]);m.get(a.mat).push({id:a.id,mat:a.mat,nom:a.agent,type:v.type,s,e})})}));return m}
function ltrOf(list){const R=LTRC(),out=new Map(),H=36e5,add=(s,m)=>{if(!out.has(s.id))out.set(s.id,[]);if(!out.get(s.id).includes(m))out.get(s.id).push(m)},dk=t=>ymd(new Date(t));
  list.sort((a,b)=>a.s-b.s);
  const gapD=(a,b)=>Math.round((+new Date(b+'T12:00')-+new Date(a+'T12:00'))/864e5);
  /* 1. jours consécutifs (jour = date de début du service) */
  const ds=[...new Set(list.map(s=>dk(s.s)))].sort(),runLen={};
  ds.forEach((d,i)=>{const p=ds[i-1];runLen[d]=p&&gapD(p,d)===1?runLen[p]+1:1});
  ds.forEach(d=>{if(runLen[d]>R.jours)list.filter(s=>dk(s.s)===d).forEach(s=>add(s,'jour '+runLen[d]+' consécutif (maximum '+R.jours+')'))});
  /* 2. repos entre deux services ; repos prolongé après la série maximale de jours consécutifs */
  let me=-1/0,md='';
  list.forEach((s,i)=>{const d=dk(s.s);
    if(i){const gap=(s.s-me)/H;
      if(d!==md&&runLen[md]>=R.jours&&gapD(md,d)!==1){if(gap<R.sem)add(s,'repos de '+dh(Math.max(0,gap)*60)+' après '+R.jours+' jours consécutifs (minimum '+R.sem+' h)')}
      else if(gap<R.repos)add(s,'repos de '+dh(Math.max(0,gap)*60)+' avant ce service (minimum '+R.repos+' h)')}
    if(s.e>me){me=s.e;md=dk(s.s)}});
  /* 3. travail dans une plage : jour (06:00-23:00) = max 13 h sur 14 h ; plage touchant la nuit (23:00-06:00) = max 11 h sur 13 h */
  const mg=[];list.forEach(s=>{const l=mg[mg.length-1];if(l&&s.s<=l[1])l[1]=Math.max(l[1],s.e);else mg.push([s.s,s.e])});
  const wk=(a,b)=>mg.reduce((n,[x,y])=>n+Math.max(0,Math.min(y,b)-Math.max(x,a)),0)/H;
  const night=(a,b)=>{for(let d=new Date(dk(a-864e5)+'T00:00');+d<b;d.setDate(d.getDate()+1)){const n0=+new Date(d.getFullYear(),d.getMonth(),d.getDate(),23),n1=+new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,6);if(Math.min(b,n1)>Math.max(a,n0))return true}return false};
  list.forEach(s=>{let best=null;
    [0,1].forEach(k=>[[R.pnuit,R.nuit,true],[R.pjour,R.jour,false]].forEach(([W,L,nt])=>{const a=k?s.e-W*H:s.s,b=k?s.e:s.s+W*H;if(night(a,b)!==nt)return;const w=wk(a,b);if(w>L&&(!best||w-L>best.x))best={w,W,L,nt,x:w-L}}));
    if(best)add(s,dh(best.w*60)+' de travail sur '+best.W+' h consécutives (maximum '+best.L+' h '+(best.nt?'sur une plage touchant la nuit':'sur une plage de jour')+')')});
  return out}
function ltrIndex(){const out=new Map();shiftsAll().forEach(l=>ltrOf(l.map(x=>({...x}))).forEach((ms,id)=>out.set(id,ms)));return out}
/* Nouvelles infractions provoquées par l'entrée de ces services (agents du pool uniquement) */
function ltrCheck(cands,excl){const all=shiftsAll(),res=[];
  [...new Set(cands.map(c=>c.mat))].forEach(mat=>{const ex=(all.get(mat)||[]).filter(x=>x.id!==excl),nw=cands.filter(c=>c.mat===mat).map((c,i)=>({id:'new'+i,mat,nom:c.nom,type:c.type,s:c.s,e:c.e}));
    const b=ltrOf(ex.map(x=>({...x}))),a=ltrOf([...ex,...nw].map(x=>({...x}))),k=(id,m)=>id+'|'+m,bs=new Set([...b].flatMap(([id,ms])=>ms.map(m=>k(id,m)))),L=[...ex,...nw];
    a.forEach((ms,id)=>ms.forEach(m=>{if(!bs.has(k(id,m))){const x=L.find(z=>z.id===id);res.push(x.nom+' — '+fmt(new Date(x.s).toISOString()).slice(0,5)+' '+x.type+' : '+m)}}))});return res}
async function resolveAsk(txt){const r=resolveAg(txt);if(!r.amb)return r;
  const mat=await choose('Plusieurs agents correspondent à « '+String(txt).trim()+' »','Choisissez la bonne personne',r.amb.map(p=>[p.mat,pcan(p)+' — matricule '+p.mat+(p.actif===false?' (inactif)':'')]));
  const p=r.amb.find(x=>x.mat===mat);return{agent:pcan(p),mat:p.mat,p}}
function agStats(){const m=new Map(),sh=shiftsAll();
  D.gardes.forEach(g=>g.services.forEach(v=>{if(v.type==='Pause')return;v.aff.forEach(a=>{if(!a.mat)return;const r=a.debut_reel&&a.fin_reel,h=(T(r?a.fin_reel:a.fin)-T(r?a.debut_reel:a.debut))/36e5;
    if(!m.has(a.mat))m.set(a.mat,{n:0,h:0,pq:0,lt:0});const o=m.get(a.mat);o.n++;o.h+=h||0;if(isPq(a))o.pq++})}));
  sh.forEach((l,mat)=>{if(m.has(mat))m.get(mat).lt=ltrOf(l.map(x=>({...x}))).size});return m}
const AGF=p=>[{k:'mat',l:'Matricule',r:1,v:p.mat},{k:'nom',l:'Nom',r:1,v:p.nom},{k:'prenom',l:'Prénom',r:1,v:p.prenom},{k:'contrat',l:'Contrat',v:p.contrat},{k:'actif',l:'Agent actif',t:'checkbox',v:p.actif!==false}];
function poolView(){const st=agStats(),q=nz(S.pf||''),pl=[...PL()].sort((a,b)=>nz(a.nom+' '+a.prenom).localeCompare(nz(b.nom+' '+b.prenom))).filter(p=>!q||nz([p.mat,p.nom,p.prenom,p.contrat].join(' ')).includes(q));
  return`<h3>Pool d’agents (${PL().length}) <button class="s" data-a="poolAdd">+ Agent</button> <button class="s" data-a="poolImp">Importer une liste</button></h3>
  <div class="fl"><label>Rechercher <input data-f="pf" value="${esc(S.pf||'')}"></label></div>
  <table><tr><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Contrat</th><th>Statut</th><th>Services</th><th>Heures</th><th>Piquets</th><th>Alertes LTR</th><th></th></tr>${pl.map(p=>{const o=st.get(p.mat)||{n:0,h:0,pq:0,lt:0};
    return`<tr${p.actif===false?' class="m"':''}><td>${esc(p.mat)}</td><td>${esc(p.nom)}</td><td>${esc(p.prenom)}</td><td>${esc(p.contrat)}</td><td>${p.actif===false?'inactif':'actif'}</td><td>${o.n}</td><td>${Math.round(o.h*10)/10} h</td><td>${o.pq}</td><td>${o.lt||''}</td><td><button class="s" data-a="poolEdit" data-m="${esc(p.mat)}" aria-label="Modifier">✎</button> <button class="s" data-a="poolTog" data-m="${esc(p.mat)}">${p.actif===false?'Activer':'Désactiver'}</button></td></tr>`}).join('')||'<tr><td>Aucun agent. Ajoutez-en ou importez une liste.</td></tr>'}</table>
  <p class="m">Suivi calculé sur les mois chargés. Un agent hors pool reste saisissable librement, sans suivi ni contrôle LTR. Renommer un agent ne modifie pas les plannings déjà saisis.</p>`}
function ltrForm(){const r=LTRC(),f=(k,l)=>`<label>${l} <input type="number" style="width:64px" data-ltr="${k}" min="1" max="99" value="${r[k]}"></label>`;
  return`<h3>Contrôle LTR (agents du pool)</h3><div class="fl">${f('jours','Jours consécutifs maximum')}${f('repos','Repos minimum entre 2 services (h)')}${f('sem','Repos après les jours consécutifs maximum (h)')}${f('jour','Travail maximum sur une plage de jour (h)')}${f('pjour','Plage de jour (h)')}${f('nuit','Travail maximum sur une plage touchant la nuit (h)')}${f('pnuit','Plage de nuit (h)')}</div><p class="m">Jour = 06:00–23:00, nuit = 23:00–06:00. Une plage qui touche la nuit suit les règles de nuit. Une alerte s’affiche quand un agent du pool enfreint une règle à son entrée en planification ; les infractions restent signalées par ⚠ dans le Gantt et dans la fiche.</p>`}
/* Référence semi-automatique : lettre = mois × type (A patient janvier, B détenu janvier, C patient février…), puis 01 à 99 */
const refKind=t=>/d[ée]tenu/i.test(t||'')?1:/patient/i.test(t||'')?0:-1;
const refLetter=(t,iso)=>{const k=refKind(t),d=new Date(T(iso));return k<0||isNaN(d)?'':String.fromCharCode(65+d.getMonth()*2+k)};
const refNext=(t,iso,skip)=>{const L=refLetter(t,iso);if(!L)return'';const y=new Date(T(iso)).getFullYear();
  const used=D.gardes.filter(g=>g.id!==skip&&(g.numero||'').toUpperCase().startsWith(L)&&/^\d{1,2}$/.test(g.numero.slice(1))&&new Date(T(g.debut_reel||g.debut_prevu)).getFullYear()===y).map(g=>+g.numero.slice(1));
  let n=Math.max(0,...used)+1;if(n>99){n=1;while(used.includes(n)&&n<=99)n++;if(n>99)return''}return L+String(n).padStart(2,'0')};
const refInit=fm=>{let touched=false;const e=fm.elements,auto=()=>{if(!touched)e.numero.value=refNext(e.type.value,toI(e.debut_prevu.value))};
  e.numero.addEventListener('input',()=>{touched=true});['type','debut_prevu'].forEach(k=>e[k].addEventListener('change',auto))};
const PAL=['#e07b00','#8a3ffc','#c2185b','#00838f'];
const tc=t=>{const x=C?.types.find(z=>z.nom===t);if(x)return x.couleur;const l=(t||'').toLowerCase();return/d[ée]tenu/.test(l)?'#1f6fd6':/patient/.test(l)?'#2e9e4f':PAL[[...l].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length]};

   config.json (types, services, couleurs, pool, règles) · AAAA/Type/Mois/AAAA_Axx_Nom_Statut.json (une surveillance par fichier) · admin.json (comptes) · sauvegardes/ */
const FILE='config.json',LOCK='gardes.verrou',BK='sauvegardes';
const wr=async(t,h)=>{const w=await h.createWritable();await w.write(t);await w.close()};
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'type';
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],STAT_F={en_cours:'Actif',a_traiter:'Fini',traitee:'Traite'};
const capSlug=n=>{const x=slug(String(n).replace(/^garde\s+/i,''));return x.charAt(0).toUpperCase()+x.slice(1)};
const typeDir=ty=>{const d=C.types.find(t=>t.nom===ty)?.dossier||capSlug(ty);return/^garde-/.test(d)?capSlug(d.slice(6)):d};
const fnPart=s=>String(s??'').normalize('NFC').replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'').trim().replace(/\s+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);

function gPath(g){const d=new Date(T(g.debut_prevu)),y=d.getFullYear();return[String(y),typeDir(g.type),MONTHS[d.getMonth()],[y,fnPart(g.numero),fnPart(g.personne)||'Sans-nom',STAT_F[g.statut]||'Actif'].filter(x=>x!=='').join('_')]}
async function dirAt(fp,create){let h=dir;for(const n of fp)h=await h.getDirectoryHandle(n,{create:!!create});return h}
async function fileAtKey(key){const p=key.split('/'),n=p.pop();return(await dirAt(p)).getFileHandle(n)}
async function rmKey(key){const p=key.split('/'),n=p.pop();try{await(await dirAt(p)).removeEntry(n)}catch(e){}}
const idb=()=>new Promise((s,j)=>{const r=indexedDB.open('suivi-gardes',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const idbGet=async k=>{const db=await idb();return new Promise((s,j)=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>s(q.result);q.onerror=()=>j(q.error)})};
const idbSet=async(k,v)=>{const db=await idb();return new Promise((s,j)=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=s;t.onerror=()=>j(t.error)})};
const rdLock=async()=>{try{return JSON.parse(await(await(await dir.getFileHandle(LOCK)).getFile()).text())}catch(e){return null}};
async function lock(){for(let i=0;i<40;i++){const l=await rdLock();
  if(!l||l.exp<Date.now()||l.owner===me){await wr(JSON.stringify({owner:me,user:S.user,exp:Date.now()+8000}),await dir.getFileHandle(LOCK,{create:true}));await sleep(150);const c=await rdLock();if(c&&c.owner===me)return true}
  await sleep(80+Math.random()*120)}return false}

async function backup(t,key,tag){const b=await dir.getDirectoryHandle(BK,{create:true});
  await wr(t,await b.getFileHandle(new Date().toISOString().replace(/[:.]/g,'-')+'_'+(key==='@cfg'?'config':key==='@pool'?'agents':key.replace(/\//g,'_').replace(/\.json$/i,''))+(tag?'_'+tag:'')+'.json',{create:true}));
  const n=[];for await(const[k]of b.entries())n.push(k);n.sort();while(n.length>300)await b.removeEntry(n.shift())}
function validate(d){

  if(!d.id)return;const ids=new Set(),u=i=>{if(ids.has(i))throw new Error('Identifiant en double : '+i);ids.add(i)};
  u(d.id);for(const s of d.services){u(s.id);for(const a of s.aff)u(a.id)}

const conflit=()=>Object.assign(new Error('Conflit : cette garde a été modifiée par un autre poste. Les données ont été rechargées. Vérifiez puis réessayez ; vos saisies restent dans le formulaire.'),{conflit:true});

/* Écriture sérialisée : verrou → relecture des fichiers concernés → modification → validation → écriture → relecture de contrôle → renommage/suppression de l'ancien fichier → copies datées */
async function commit(fn){
  if(!dir||!D)throw new Error('Aucun dossier connecté.');
  setSt('Enregistrement en cours…','w');busy=true;let lk=false;const E=new Map();
  const readJ=async(h,key)=>{const t=await(await h.getFile()).text();try{return JSON.parse(t)}catch(e){throw new Error('Fichier JSON invalide ('+key+') : écriture bloquée.')}};
  const ctx={
    pool:async()=>{if(!E.has('@pool'))E.set('@pool',{key:'@pool',cfg:1,h:MO['@pool'].h,data:await readJ(MO['@pool'].h,'agents.json')});return E.get('@pool').data},
    cfg:async()=>{if(!E.has('@cfg'))E.set('@cfg',{key:'@cfg',cfg:1,h:MO['@cfg'].h,data:await readJ(MO['@cfg'].h,'config.json')});return E.get('@cfg').data},
    garde:async id=>{if(E.has(id))return E.get(id).data;const src=D.gardes.find(z=>z.id===id);if(!src)throw new Error('Garde introuvable.');
      let h;try{h=await fileAtKey(src._k)}catch(e){throw conflit()}
      const data=await readJ(h,src._k);E.set(id,{id,key:src._k,h,data});return data},
    create:g=>{g.schema_version=1;g.audit=g.audit||[];E.set(g.id,{id:g.id,key:null,h:null,data:g,isNew:true});return g},
    remove:id=>{const e=E.get(id);if(!e)throw new Error('Garde non ouverte.');e.del=true}};
  try{
    if(!await lock())throw new Error('Fichiers verrouillés par un autre poste. Réessayez dans quelques secondes.');lk=true;
    const a=await fn(ctx);if(a.cfg)await ctx.cfg();if(a.pool)await ctx.pool();
    const L=[...E.values()],main=a.pool?E.get('@pool'):a.cfg?E.get('@cfg'):L.find(e=>!e.cfg&&!e.del);if(!main)throw new Error('Aucune donnée à enregistrer.');
    (main.data.audit=main.data.audit||[]).push({id:uid(),le:new Date().toISOString(),user:S.user||'(non renseigné)',role:S.role,action:a.action,objet:a.objet,details:a.details});
    const W=[];
    for(const e of L){if(e.del)continue;validate(e.data);
      if(e.cfg){e.data.rev=(e.data.rev||0)+1;e.out=JSON.stringify(e.data,null,1);W.push(e);continue}
      const fp=gPath(e.data),fk=fp.slice(0,3).join('/'),dh=await dirAt(fp.slice(0,3),true);let nm=fp[3]+'.json';
      if(fk+'/'+nm!==e.key){let ex=true;try{await dh.getFileHandle(nm)}catch(x){ex=false}if(ex)nm=fp[3]+'-'+e.data.id.slice(-4)+'.json'}
      e.nkey=fk+'/'+nm;e.dh=dh;e.nm=nm;e.out=JSON.stringify(e.data,null,1);W.push(e)}
    for(const e of[...W].reverse()){if(e.cfg)await wr(e.out,e.h);else{e.h2=await e.dh.getFileHandle(e.nm,{create:true});await wr(e.out,e.h2)}}
    for(const e of W){const f=await(e.cfg?e.h:e.h2).getFile();if((await f.text())!==e.out)throw new Error('Relecture différente : enregistrement non confirmé.');e.mod=f.lastModified;e.size=f.size}
    for(const e of L){if(e.cfg)continue;if(e.del)await rmKey(e.key);else if(e.key&&e.key!==e.nkey)await rmKey(e.key)}
    L.forEach(e=>{if(e.cfg){MO[e.key]={h:e.h,t:e.out,data:e.data,mod:e.mod,size:e.size};return}
      if(e.key)delete MO[e.key];if(!e.del){MO[e.nkey]={h:e.h2,t:e.out,data:e.data,mod:e.mod,size:e.size};LF.add(e.nkey.split('/').slice(0,3).join('/'))}});
    rebuild();setSt('Enregistrement confirmé','o');sync();$('err').style.display='none';
    try{for(const e of L){if(e.cfg)await backup(e.out,e.key);else if(e.del)await backup(JSON.stringify(e.data,null,1),e.key,'supprimee');else await backup(e.out,e.nkey)}$('bk').textContent='Dernière sauvegarde : '+tm(new Date())}catch(e){$('bk').textContent='ÉCHEC sauvegarde : '+e.message}
  }catch(e){setSt(e.conflit?'Conflit détecté':'Enregistrement échoué','k');if(e.conflit)try{await pollOnce(1)}catch(x){}throw e}
  finally{if(lk)await unlock();busy=false}
  render();
}
const upd=(id,v0,fn)=>{if(!D.gardes.find(z=>z.id===id))throw new Error('Garde introuvable.');
  return commit(async ctx=>{const x=await ctx.garde(id);if(x.v!==v0)throw conflit();const r=fn(x,x);recalc(x);x.v++;return r})};

/* Mois à charger : mois courant et précédent, plus ceux demandés par les filtres */
function wanted(){const s=new Set(),cur=ymd(new Date()).slice(0,7);
  const rng=(a,b)=>{a=(a||b||'').slice(0,7);b=(b||a).slice(0,7);if(!a)return;let[y,m]=a.split('-').map(Number);for(let i=0;i<60;i++){const k=y+'-'+P(m);s.add(k);if(k>=b)break;if(++m>12){m=1;y++}}};
  const pm=d=>{const x=new Date((d||ymd(new Date())).slice(0,7)+'-01T00:00');x.setMonth(x.getMonth()-1);return ymd(x).slice(0,7)};
  rng(pm(),cur);rng(S.f.du,S.f.du?(S.f.au||cur):S.f.au);rng(S.h.du,S.h.du?(S.h.au||cur):S.h.au);rng(S.cmon);rng(pm(S.cday),S.cday);rng(pm(S.day),S.day);return s}
const LF=new Set(),SEEN=new Set();
async function scanFolder(key,deep){const pre=key+'/';let dh,ch=false;
  try{dh=await dirAt(key.split('/'))}catch(e){for(const k of Object.keys(MO))if(k.startsWith(pre)){delete MO[k];ch=true}return ch}
  const names=new Map();for await(const[n,h]of dh.entries())if(h.kind==='file'&&/\.json$/i.test(n))names.set(pre+n,h);
  for(const k of Object.keys(MO))if(k.startsWith(pre)&&!names.has(k)){delete MO[k];ch=true}
  for(const[k,h]of names){const e=MO[k];if(e&&!deep&&e.data.statut==='traitee')continue;
    const f=await h.getFile();if(e&&e.mod===f.lastModified&&e.size===f.size)continue;
    const tx=await f.text();let d;try{d=JSON.parse(tx);validate(d)}catch(x){throw new Error('Fichier invalide : '+k+' ('+x.message+')')}
    MO[k]={h,t:tx,data:d,mod:f.lastModified,size:f.size};ch=true}
  return ch}
async function loadWindow(deep){const keys=[];
  if(S.all){for await(const[y,yh]of dir.entries()){if(yh.kind!=='directory'||!/^\d{4}$/.test(y))continue;
    for(const t of C.types){const td=typeDir(t.nom);let th;try{th=await yh.getDirectoryHandle(td)}catch(e){continue}
      for(const mo of MONTHS){try{await th.getDirectoryHandle(mo);keys.push(y+'/'+td+'/'+mo)}catch(e){}}}}}
  else wanted().forEach(k=>{const[y,m]=k.split('-');C.types.forEach(t=>keys.push(y+'/'+typeDir(t.nom)+'/'+MONTHS[+m-1]))});
  keys.forEach(k=>LF.add(k));let ch=false;
  for(const k of LF){const d=deep||!SEEN.has(k);SEEN.add(k);if(await scanFolder(k,d))ch=true}
  return ch}
const UID={police:14,barre:36,service:22,libelle:170,panneau:380,horloge:34},UIR={police:[11,22],barre:[22,64],service:[16,40],libelle:[120,320],panneau:[280,560],horloge:[20,64]};
const UI=()=>({...UID,...(C?.affichage||{})});

function rebuild(){C=MO['@cfg'].data;AG=MO['@pool']?MO['@pool'].data:null;applyUi();const m=new Map(),au=[...(C.audit||[]),...(AG?.audit||[])];
  for(const[k,e]of Object.entries(MO)){if(k==='@cfg'||k==='@pool')continue;const g=e.data;g._k=k;au.push(...(g.audit||[]));const o=m.get(g.id);if(!o||(o.v||0)<=(g.v||0))m.set(g.id,g)}
  D={gardes:[...m.values()],audit:au.sort((a,b)=>a.le<b.le?-1:1)}}
async function pollOnce(q){S.pn=(S.pn||0)+1;let ch=await loadWindow(S.pn%6===0);
  for(const k of['@cfg','@pool']){const c=MO[k],f=await c.h.getFile();if(f.lastModified!==c.mod||f.size!==c.size){const t=await f.text(),d=JSON.parse(t);validate(d);MO[k]={h:c.h,t,data:d,mod:f.lastModified,size:f.size};ch=true}}
  if(ch){rebuild();if(!$('dlg').open)render();if(!q)setSt('Données mises à jour (autre poste)','o')}sync()}
const note=()=>{const ms=[...LF].map(k=>{const p=k.split('/');return p[0]+'-'+P(MONTHS.indexOf(p[2])+1)}).sort();return`<p class="m">Mois chargés : ${ms.length?ms[0]+' → '+ms[ms.length-1]:'aucun'}${S.all?' (tout)':' · <button class="s" data-a="loadAll">Tout charger</button>'}</p>`};

/* ===== Comptes administrateur (admin.json, mots de passe hachés PBKDF2) ===== */
const hx=async(pw,salt)=>{if(!crypto.subtle)throw new Error('Hachage indisponible dans ce contexte.');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))};
const mkAcc=async(id,pw)=>{const sel=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));return{id:id.trim(),sel,hash:await hx(pw,sel)}};
const admRead=async()=>{try{return JSON.parse(await(await(await dir.getFileHandle('admin.json')).getFile()).text())}catch(e){if(e.name==='NotFoundError')return null;throw new Error('admin.json illisible : '+e.message)}};
const admWrite=async d=>wr(JSON.stringify(d,null,1),await dir.getFileHandle('admin.json',{create:true}));
const okAdm=id=>{S.role='Administrateur';S.admin=id;if(!S.user){S.user=id;$('user').value=id}S.view='admin';$('role').value=S.role};
const pwOk=f=>{if(f.pw.length<8||f.pw!==f.pw2)throw new Error('Mots de passe différents ou trop courts (8 caractères minimum).')};
const PW=[{k:'pw',l:'Mot de passe (8 caractères minimum)',t:'password',r:1,v:''},{k:'pw2',l:'Confirmer le mot de passe',t:'password',r:1,v:''}];

  if(!d)return form('Créer le premier compte administrateur',[{k:'id',l:'Identifiant',r:1,v:''},...PW],async f=>{pwOk(f);await admWrite({schema_version:1,comptes:[await mkAcc(f.id,f.pw)]});okAdm(f.id.trim())});
  form('Connexion administrateur',[{k:'id',l:'Identifiant',r:1,v:''},{k:'pw',l:'Mot de passe',t:'password',r:1,v:''}],async f=>{

/* ===== Connexion ===== */
async function openDir(d){
  dir=d;let ch;
  try{ch=await dir.getFileHandle(FILE)}catch(e){
    if(e.name!=='NotFoundError')throw e;
    if(!confirm('Aucune configuration dans ce dossier. Créer un espace de données vide (config.json et l’arborescence AAAA/Type/Mois) ?'))return;
    ch=await dir.getFileHandle(FILE,{create:true});const c=seed();await wr(JSON.stringify(c,null,1),ch);
    for(const t of c.types)await dirAt([String(new Date().getFullYear()),t.dossier],true);
  }
  const fl=await ch.getFile(),tx=await fl.text();
  try{const c=JSON.parse(tx);validate(c);if(!c.types||!c.services)throw new Error('configuration incomplète');
    for(const k in MO)delete MO[k];LF.clear();SEEN.clear();MO['@cfg']={h:ch,t:tx,data:c,mod:fl.lastModified,size:fl.size};
    let ah;try{ah=await dir.getFileHandle('agents.json')}catch(e){if(e.name!=='NotFoundError')throw e;ah=await dir.getFileHandle('agents.json',{create:true});await wr(JSON.stringify({schema_version:1,rev:0,pool:c.pool||[],audit:[]},null,1),ah)}
    const af=await ah.getFile(),at=await af.text(),ad=JSON.parse(at);validate(ad);if(!Array.isArray(ad.pool))ad.pool=[];MO['@pool']={h:ah,t:at,data:ad,mod:af.lastModified,size:af.size};
    rebuild();await loadWindow();rebuild()}
  catch(e){D=null;throw new Error('Configuration illisible ou invalide ('+e.message+'). Aucune écriture effectuée.')}
  setSt('Connecté','o');sync();render();
}

  pool:[],types:[{nom:'Garde détenu',couleur:'#1f6fd6',dossier:'Detenu'},{nom:'Garde patient',couleur:'#2e9e4f',dossier:'Patient'}],

/* ===== Formulaires ===== */
function form(title,fs,ok,init){
  const d=$('dlg');
  d.innerHTML=`<form><h3>${title}</h3>${fs.map(f=>{if(f.t==='checkbox')return`<label><input type="checkbox" name="${f.k}" value="1"${f.v?' checked':''}> ${f.l}</label>`;const n=`name="${f.k}"${f.r?' required':''}`;
    const c=f.o?`<select ${n}>${f.o.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${v===f.v?' selected':''}>${esc(l)}</option>`}).join('')}</select>`
      :f.t==='area'?`<textarea ${n} rows="3">${esc(f.v)}</textarea>`:`<input ${n} type="${f.t||'text'}" value="${esc(f.v)}">`;
    return`<label>${f.l}${f.r?' *':''}${c}</label>`}).join('')}<p id="ferr" role="alert" class="er"></p><p><button>Enregistrer</button> <button type="button" class="s" data-a="close">Annuler</button></p></form>`;
  const fm=d.querySelector('form');
  fm.onsubmit=async e=>{e.preventDefault();$('ferr').textContent='';try{const v=Object.fromEntries(new FormData(fm));fs.forEach(x=>{if(x.t==='checkbox')v[x.k]=v[x.k]?'1':''});await ok(v);d.close()}catch(x){$('ferr').textContent=x.message}};
  d.showModal();if(init)init(fm);
}
const DT=(k,l,v,r)=>({k,l,t:'datetime-local',v:toL(v),r});
function apply(o,f,ks,d){const ch=[];for(const k of ks){if(!(k in f))continue;

function stats(){
  const f=S.f,a=f.du?+new Date(f.du+'T00:00'):-1/0,b=f.au?+new Date(f.au+'T00:00')+864e5:1/0;
  const gs=D.gardes.filter(g=>{const s=T(g.debut_reel||g.debut_prevu);return s>=a&&s<b&&(!f.type||g.type===f.type)&&(!f.loc||(g.localisation||'').toLowerCase().includes(f.loc.toLowerCase()))});
  const h=(x,y)=>Math.max(0,(y-x)/36e5),r={n:gs.length,types:{},st:{en_cours:0,a_traiter:0,traitee:0},dur:0,ha:0,hp:0,ag:new Set(),sv:0,pq:0,pqt:{},per:{}};
  gs.forEach(g=>{r.types[g.type]=(r.types[g.type]||0)+1;r.st[g.statut]++;
    const s=T(g.debut_reel||g.debut_prevu),e=T(g.fin_reel||g.fin_prevue)||Date.now();r.dur+=h(s,e);
    const k=ymd(new Date(s)).slice(0,S.grp==='jour'?10:S.grp==='mois'?7:4);r.per[k]=(r.per[k]||0)+1;
    g.services.forEach(v=>{r.sv+=new Set(v.aff.map(x=>ymd(new Date(T(x.debut))))).size;if(v.type==='Pause')return;v.aff.forEach(x=>{const u=x.debut_reel&&x.fin_reel,q=h(T(u?x.debut_reel:x.debut),T(u?x.fin_reel:x.fin));r.ha+=q;r.ag.add((x.mat||x.agent||'').toLowerCase());if(isPq(x)){r.pq++;r.hp+=q;const o=r.pqt[g.type]||(r.pqt[g.type]={n:0,h:0});o.n++;o.h+=q}})})});
  return r;
}
function svg(ser,n,lab,tk){

  for(let i=0;i<n;i++)if(tk(i))g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${lab(i)}</text>`;

      return`<div class="gr sub" style="height:${Math.max(1,ln.length)*(UI().service+4)+4}px"><div class="gl">&nbsp;&nbsp;↳ <i class="dot" style="background:${sc(t)}"></i>${esc(t)}</div><div class="gt">${it.map(x=>{const a=x.a,nm=x.n.join(', '),hh=tm(a.debut)+'–'+tm(a.fin);
        return bar(T(a.debut),T(a.fin),sc(t),(T(a.debut)<d0?'◂ ':'')+esc(nm)+' · '+hh+(T(a.fin)>d1?' ▸':''),t+' · '+nm+' · '+hh,'top:'+(3+x.k*(UI().service+4))+'px')}).join('')||'<span class="m" style="display:block;padding:6px 8px">aucun agent</span>'}</div></div>`}).join('')};
  const rows=l.map(g=>{const s=T(g.debut_reel||g.debut_prevu),e=T(g.fin_reel||g.fin_prevue)||Math.max(s,now),o=S.open.has(g.id),c=tc(g.type),it=info(g),w=pc(e)-pc(s);
    const h=`<span class="t">${it.map(([k,v])=>(k?`<span class="kk">${k}</span>`:'')+esc(v)).join('<span class="ss">|</span>')}</span>`,ti=it.map(([k,v])=>(k?k+' ':'')+v).join(' | ');
    const chip=w<55?`<div class="gx" title="${esc(ti)}" style="background:${c};${pc(s)+w/2<50?`left:${pc(e)}%;max-width:${100-pc(e)}%`:`right:${100-pc(s)}%;max-width:${pc(s)}%`}">${h}</div>`:'';
    return`<div class="gr" tabindex="0" data-a="togG" data-id="${g.id}"><div class="gl">${o?'▾':'▸'} <b>${esc(ref(g))}</b>${(g.liens||[]).length?` <span title="Surveillances liées : ${esc(g.liens.map(k=>k.numero).join(', '))}">🔗</span>`:''}<br>${dot(g.type)}${esc(g.type)}</div><div class="gt">${bar(s,e,c,w<55?'':h,ti,'','main')}${chip}</div></div>${o?svRows(g):''}`}).join('');
  const nl=S.day===ymd(new Date())?`<div class="now" style="left:calc(var(--lab,170px) + (100% - var(--lab,170px)) * ${(now-d0)/864e5})" title="Heure actuelle"></div>`:'';
  return`<div class="c"><h2>Gardes en cours</h2>${note()}<div class="fl"><label>Jour <input type="date" data-f="day" value="${S.day}"></label><button class="s" data-a="today">Aujourd’hui</button><label>Tri <select data-f="gs">${[['type','Type de garde (ordre défini)'],['debut','Début'],['ref','Référence']].map(([v,t])=>`<option value="${v}"${S.gs===v?' selected':''}>${t}</option>`).join('')}</select></label>${rw()?'<button data-a="newG">+ Nouvelle garde</button>':''}</div>
  <div class="gw"><div class="gr" style="height:20px;border:0;cursor:default"><div class="gl"></div><div class="gt gh" style="background:none">${Array.from({length:24},(_,h)=>`<span>${h%2?'':P(h)}</span>`).join('')}</div></div>${rows||'<p class="m">Aucune garde en cours ce jour-là.</p>'}${nl}</div>
  <p class="m">Échelle 00:00–24:00. Cliquez sur une garde pour déplier ses services : une ligne par service (Matin, Après-midi, Nuit), avec les noms des agents dans les barres. Les gardes à cheval sur minuit sont découpées par jour (◂ ▸).</p></div>`;
}
const vTraiter=()=>`<div class="c"><h2>Gardes terminées à traiter</h2>${note()}${tbl(D.gardes.filter(g=>g.statut==='a_traiter'))}</div>`;
function vHist(){
  const h=S.h,fi=(k,l,t='text')=>`<label>${l} <input type="${t}" data-f="h.${k}" value="${esc(h[k]||'')}"></label>`;
  const l=D.gardes.filter(g=>(!h.num||((g.numero||'')+(S.role!=='Consultation'?' '+(g.personne||''):'')).toLowerCase().includes(h.num.toLowerCase()))&&(!h.type||g.type===h.type)&&(!h.loc||(g.localisation||'').toLowerCase().includes(h.loc.toLowerCase()))&&(!h.st||g.statut===h.st)
    &&(!h.du||T(g.debut_reel||g.debut_prevu)>=+new Date(h.du+'T00:00'))&&(!h.au||T(g.debut_reel||g.debut_prevu)<+new Date(h.au+'T00:00')+864e5)
    &&(!h.ag||g.services.some(s=>s.aff.some(a=>AN(a.agent).toLowerCase().includes(h.ag.toLowerCase())))));
  return`<div class="c"><h2>Historique</h2>${note()}<div class="fl">${fi('num','Référence ou n°')}<label>Type <select data-f="h.type">${opts(TN(),h.type,'Tous')}</select></label>${fi('loc','Localisation')}
  ${fi('du','Du','date')}${fi('au','Au','date')}${fi('ag','Agent')}
  <label>Statut <select data-f="h.st"><option value="">Tous</option>${Object.entries(LBL).map(([k,v])=>`<option value="${k}"${h.st===k?' selected':''}>${v}</option>`).join('')}</select></label></div>${tbl(l)}</div>`;
}
function uiForm(){const u=UI(),f=(k,l)=>`<label>${l} <input type="number" style="width:76px" data-ui="${k}" min="${UIR[k][0]}" max="${UIR[k][1]}" value="${u[k]}"> <span class="m">px</span></label>`;
  return`<h3>Affichage (appliqué à tous les postes)</h3><div class="fl">${f('police','Police générale')}${f('barre','Hauteur des barres de garde')}${f('service','Hauteur des barres de service')}${f('libelle','Largeur de la colonne des libellés')}${f('panneau','Largeur du panneau latéral')}${f('horloge','Taille de l’horloge')}</div><p><button class="s" data-a="rstUi">Rétablir les valeurs par défaut</button></p>`}
function vAdmin(){
  if(!adm())return'<div class="c">Réservé à l’administrateur (connexion requise).</div>';
  const col=(k,x)=>`<input type="color" value="${esc(x.couleur)}" data-col="${k}" data-n="${esc(x.nom)}" aria-label="Couleur de ${esc(x.nom)}">`;
  return`<div class="c"><h2>Administration</h2><p class="m">Connecté : ${esc(S.admin)}</p>
  <h3>Types de gardes <button class="s" data-a="addT">+ Type</button></h3><table>${C.types.map((t,i)=>`<tr><td>${col('types',t)}</td><td>${esc(t.nom)}</td><td class="m">AAAA/${esc(typeDir(t.nom))}/Mois/</td><td><button class="s" data-a="mvT" data-n="${esc(t.nom)}" data-d="-1"${i?'':' disabled'} aria-label="Monter">↑</button> <button class="s" data-a="mvT" data-n="${esc(t.nom)}" data-d="1"${i<C.types.length-1?'':' disabled'} aria-label="Descendre">↓</button></td></tr>`).join('')}</table>
  <h3>Types de services <button class="s" data-a="addSv">+ Service</button></h3><table>${C.services.map(t=>`<tr><td>${col('services',t)}</td><td>${esc(t.nom)}</td><td class="m">${t.debut&&t.fin?t.debut+'–'+t.fin:'horaires à saisir'}</td></tr>`).join('')}</table>
  ${poolView()}
  ${ltrForm()}
  ${uiForm()}
  <h3>Comptes</h3><p><button class="s" data-a="chpw">Changer mon mot de passe</button> <button class="s" data-a="addAdm">+ Compte administrateur</button></p></div>
  <div class="c"><h3>Journal d’audit (100 derniers, mois chargés)</h3><table>${[...D.audit].reverse().slice(0,100).map(a=>`<tr><td>${fmt(a.le)}</td><td>${esc(a.user)} (${esc(a.role)})</td><td>${esc(a.action)}</td><td>${esc(a.objet)}</td><td>${esc(a.details)}</td></tr>`).join('')||'<tr><td>Aucun événement.</td></tr>'}</table></div>`;
}
function SV(g,ed,c){const l=g.services.filter(s=>s.aff.length).sort((a,b)=>rank(a.type)-rank(b.type));
  return l.map(s=>`<div class="sv2"><b><i class="dot" style="background:${sc(s.type)}"></i>${esc(s.type)}</b> <span class="m">${hor(s.type).join('–')}</span><ul>${[...s.aff].sort((a,b)=>T(a.debut)-T(b.debut)||AN(a.agent).localeCompare(AN(b.agent))).map(a=>`<li>${esc(AN(a.agent))} · ${fmt(a.debut).slice(0,6)} ${tm(a.debut)}–${tm(a.fin)}<label class="m" title="Droit à la rémunération de piquet"><input type="checkbox" data-a="tgP" data-s="${s.id}" data-i="${a.id}"${isPq(a)?' checked':''}${ed?'':' disabled'}> piquet</label> ${ed?`<button class="s" data-a="editA" data-s="${s.id}" data-i="${a.id}" aria-label="Modifier l’affectation">✎</button>`:''}${c?`<button class="x" data-a="delA" data-s="${s.id}" data-i="${a.id}" aria-label="Retirer l’agent">✕</button>`:''}</li>`).join('')}</ul></div>`).join('')||'<p class="m">Aucun agent planifié.</p>'}
function detail(){
  const g=D.gardes.find(x=>x.id===S.sel);if(!g)return'<div class="c m">Sélectionnez une garde pour afficher sa fiche.</div>';
  const ed=canEdit(g),c=g.statut==='en_cours'&&rw(),nm=S.role==='Consultation',row=(a,b)=>`<tr><td class="m">${a}</td><td>${b}</td></tr>`;
  const w=[],LT=ltrIndex();g.services.forEach(s=>s.aff.forEach(a=>{if(!(T(a.fin)>T(a.debut)))w.push(AN(a.agent)+' : horaires incohérents');warns(D,{...a,nom:AN(a.agent)}).forEach(x=>w.push(AN(a.agent)+' : '+x));(LT.get(a.id)||[]).forEach(m=>w.push(AN(a.agent)+' : LTR — '+m))}));
  const au=(g.audit||[]).slice(-6).reverse();
  return`<div class="c"><h2>${esc(ref(g))} <span class="chip ${g.statut}">${LBL[g.statut]}</span></h2><table>${row('ID',esc(g.numero))}${row('Type',dot(g.type)+esc(g.type))}${row('Localisation',esc(g.localisation))}${g.provenance?row('Provenance',nm?'(masqué)':esc(g.provenance)):''}${g.tel_service?row('Téléphone de service',esc(g.tel_service)):''}${g.radio_service?row('Radio de service',esc(g.radio_service)):''}${row('Risques',nm?'(masqué)':esc(g.risques))}
  ${row('Début',fmt(g.debut_prevu))}${row('Fin (selon les agents)',fmt(g.fin_reel||g.fin_prevue))}${g.traite_le?row('Traitée',fmt(g.traite_le)+' par '+esc(g.traite_par)):''}</table>
  <p>${ed?'<button data-a="editG">Modifier</button> ':''}${rw()?'<button class="s" data-a="exportG">Exporter en PDF</button> ':''}${c?'<button data-a="clot">Clôturer</button> ':''}${g.statut==='a_traiter'&&rw()?'<button data-a="trait">Marquer traitée</button> ':''}${g.statut==='traitee'&&adm()?'<button class="x" data-a="reopen">Rouvrir</button>':''}${ed?' <button class="x" data-a="delG">Supprimer</button>':''}</p>
  ${w.length?`<div class="wn"><b>À vérifier :</b><br>${w.map(esc).join('<br>')}</div>`:''}
  ${LK(g,ed)}<h3>Services et agents</h3>${SV(g,ed,c)}${c?'<p><button class="s" data-a="addA">+ Agents</button></p>':''}
  <h3>Historique des modifications</h3>${au.map(a=>`<div class="m">${fmt(a.le)} · ${esc(a.user)} · ${esc(a.action)}${a.details?' — '+esc(a.details):''}</div>`).join('')||'<div class="m">Aucun événement.</div>'}</div>`;
}
function render(){
  const ap=$('app'),pb=$('pan');pb.style.display=D?'':'none';ap.classList.toggle('nopan',!S.pan);pb.textContent=S.pan?'»':'«';
  pb.setAttribute('aria-expanded',String(S.pan));pb.setAttribute('aria-label',S.pan?'Masquer le panneau de détail':'Afficher le panneau de détail');
  if(!D){ap.innerHTML=`<div class="c"><h2>Connexion au dossier de données</h2><p>Choisissez le dossier partagé qui contient (ou contiendra) <code>${FILE}</code>. Les copies datées sont écrites dans <code>${BK}</code>.</p>
    <p><button data-a="pick"${'showDirectoryPicker'in window?'':' disabled'}>Choisir le dossier partagé</button> <button class="s" data-a="resume">Reprendre le dossier précédent</button></p>
    ${'showDirectoryPicker'in window?'':'<p class="er">Ce navigateur ne permet pas l’accès direct aux fichiers (File System Access API).</p>'}</div><div></div>`;return}
  $('tadm').style.display=adm()?'':'none';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('n1').textContent='('+D.gardes.filter(g=>g.statut==='en_cours').length+')';$('n2').textContent='('+D.gardes.filter(g=>g.statut==='a_traiter').length+')';
  ap.innerHTML=`<div>${{dash:vDash,cours:vCours,traiter:vTraiter,hist:vHist,admin:vAdmin}[S.view]()}</div><aside>${detail()}</aside>`;
}

/* ===== Actualisation périodique ===== */
setInterval(async()=>{if(!dir||busy||!D)return;try{await pollOnce()}catch(e){setSt('Fichier illisible','k');showErr(new Error('Lecture impossible ou fichier invalide : '+e.message+'. Aucune écriture ne sera effectuée.'))}},5000);
const DJ=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function tick(){const d=new Date();$('clk').textContent=P(d.getHours())+':'+P(d.getMinutes())+':'+P(d.getSeconds());$('cdate').textContent=DJ[d.getDay()]+' '+P(d.getDate())+'.'+P(d.getMonth()+1)+'.'+d.getFullYear()}
tick();setInterval(tick,1000);
setInterval(()=>{if(D&&S.view==='cours'&&!$('dlg').open&&!busy)render()},30000);
render();
</script>
</body>
</html>
